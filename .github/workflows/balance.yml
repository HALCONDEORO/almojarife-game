name: Balance
# Fast gate on pull requests (10 game years) and full 100-year run on pushes to main:
# both fire only when a change can move the simulation. Nightly and on-demand always run the full set.
# Both filters are fail-closed: everything matches "**" except paths proven sim-irrelevant below.
on:
  pull_request:
    paths:
      # Last matching pattern wins. Unknown/new paths stay covered (fail-closed).
      - "**"
      # Browser bundle: the sim (node tools/) never imports web/.
      - "!web/**"
      # UI views are presentation-only...
      - "!src/view/**"
      # ...except cityscene.mjs: src/game/* imports its seeded() hash (economy-relevant).
      - "src/view/cityscene.mjs"
      # Tests cannot change sim results; the CI test suite covers them on every push/PR.
      - "!test/**"
      # Docs and images never move the simulation.
      - "!**/*.md"
      - "!docs/**"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
  push:
    branches: [main]
    paths:
      # Last matching pattern wins. Unknown/new paths stay covered (fail-closed).
      - "**"
      # Browser bundle: the sim (node tools/) never imports web/.
      - "!web/**"
      # UI views are presentation-only...
      - "!src/view/**"
      # ...except cityscene.mjs: src/game/* imports its seeded() hash (economy-relevant).
      - "src/view/cityscene.mjs"
      # Tests cannot change sim results; the CI test suite covers them on every push/PR.
      - "!test/**"
      # Docs and images never move the simulation.
      - "!**/*.md"
      - "!docs/**"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
  schedule:
    - cron: "17 2 * * *" # nightly, 02:17 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: "Extra game seeds for bots B and C (comma list; default 1,2,3)"
        required: false
        default: "1,2,3"
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: sh tools/fetch_data.sh
      - name: Balance gate (fast on PRs, 100 years otherwise)
        env:
          BALANCE_DAYS: ${{ github.event_name == 'pull_request' && '3650' || '' }}
          BALANCE_SEEDS: ${{ github.event.inputs.seeds || '1,2,3' }}
        run: node tools/sim_balance_check.mjs
