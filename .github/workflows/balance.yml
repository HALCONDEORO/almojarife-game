name: Balance
# Cost policy (owner rule: stay inside the monthly Actions budget, ~$5 on top of the free tier).
# The 100-year sim grew from ~51 to ~90+ minutes a run this month, so the horizons are spread:
#   PR gate ......... 10 game years (3650 days), default + 3 extra seeds (unchanged)
#   push to main .... 10 game years, default + 3 extra seeds (was 100 years; the same code just
#                     passed the identical PR gate, and the weekly run keeps the 100y coverage)
#   nightly 02:17 ... 30 game years (10950 days), default game only
#   weekly Sun 02:47  100 game years, default + 1 extra seed (the deep-horizon run; further seeds
#                     stay available on demand via workflow_dispatch)
# Both path filters are fail-closed: everything matches "**" except paths proven sim-irrelevant below.
on:
  pull_request:
    paths:
      # Last matching pattern wins. Unknown/new paths stay covered (fail-closed).
      - "**"
      # Browser bundle: the sim (node tools/) never imports web/.
      - "!web/**"
      # UI views are presentation-only...
      - "!src/view/**"
      # ...except cityscene.mjs: src/game/* imports its seeded() hash (economy-relevant).
      - "src/view/cityscene.mjs"
      # Tests cannot change sim results; the CI test suite covers them on every push/PR.
      - "!test/**"
      # Docs and images never move the simulation.
      - "!**/*.md"
      - "!docs/**"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
  push:
    branches: [main]
    paths:
      # Last matching pattern wins. Unknown/new paths stay covered (fail-closed).
      - "**"
      # Browser bundle: the sim (node tools/) never imports web/.
      - "!web/**"
      # UI views are presentation-only...
      - "!src/view/**"
      # ...except cityscene.mjs: src/game/* imports its seeded() hash (economy-relevant).
      - "src/view/cityscene.mjs"
      # Tests cannot change sim results; the CI test suite covers them on every push/PR.
      - "!test/**"
      # Docs and images never move the simulation.
      - "!**/*.md"
      - "!docs/**"
      - "!**/*.png"
      - "!**/*.jpg"
      - "!**/*.jpeg"
      - "!**/*.gif"
      - "!**/*.svg"
  schedule:
    - cron: "17 2 * * *" # nightly, 02:17 UTC: 30-year mid-horizon run, default game only
    - cron: "47 2 * * 0" # weekly, Sunday 02:47 UTC: the full 100-year run with one extra seed
  workflow_dispatch:
    inputs:
      seeds:
        description: "Extra game seeds for bots B and C (comma list; default 1,2,3)"
        required: false
        default: "1,2,3"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: sh tools/fetch_data.sh
      - name: Balance gate (10y on PRs and main pushes, 30y nightly, 100y weekly)
        env:
          BALANCE_DAYS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '3650' || (github.event.schedule == '17 2 * * *' && '10950' || '36500') }}
          BALANCE_SEEDS: ${{ github.event.inputs.seeds || (github.event.schedule == '17 2 * * *' && 'none' || (github.event.schedule == '47 2 * * 0' && '1' || '1,2,3')) }}
        run: node tools/sim_balance_check.mjs
