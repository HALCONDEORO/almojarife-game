name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Cache the Natural Earth download
        uses: actions/cache@v6
        with:
          path: data/ne_50m_land.geojson
          key: ne50m-${{ hashFiles('tools/fetch_data.sh') }}
      - run: sh tools/fetch_data.sh
      - run: npm test
