name: Banner
# Fails if the README banner or the social image no longer match data/world.json.
# Fix: python3 tools/build_banner.py --png, then commit docs/images/.
on:
  pull_request:
    paths: ['data/world.json', 'assets/map/**', 'tools/build_banner.py', 'docs/images/**']
  push:
    branches: [main]
    paths: ['data/world.json', 'assets/map/**', 'tools/build_banner.py', 'docs/images/**']
permissions:
  contents: read
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/build_banner.py --check
