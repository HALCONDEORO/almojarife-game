<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Prototipo de calles</title><style>body{margin:0;background:#193f4b;font:16px Georgia;color:#382c1d}canvas{display:block}aside{position:fixed;top:12px;left:12px;max-width:320px;background:#fff3d9ed;padding:16px;border:2px solid #846039;border-radius:6px}h1{font-size:22px;margin:0 0 8px}button,select{font:inherit;padding:8px}#info{line-height:1.5}small{display:block;margin:8px 0}</style><aside><h1>Ciudad: calles y parcelas</h1><label>Puerto <select id="city"><option value="cadiz">Cádiz · 8.000</option><option value="barcelona">Barcelona · 25.000</option><option value="lisboa">Lisboa · 15.000</option></select></label><small>Prototipo aislado. No modifica la partida.<br>Arrastra para girar. Pulsa un edificio.</small><div id="info"></div><small>Generación: gen-city · MIT · Nikita Galadiy.<br>Modelos y textos propios. Sin assets externos.</small></aside><script type="module">
import * as THREE from '../vendor/three.module.min.js';import {cityPlots} from '../../src/view3d/cityplots.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(renderer.domElement);
let scene,cam,layout,targets=[],yaw=.7,drag=null,moved=0;
const names={market:'Mercado',shipyard:'Astillero',tavern:'Taberna',bank:'Banco',office:'Oficina',warehouse:'Almacén',workshop:'Taller',house:'Casa'};
const colors={market:0xc49143,shipyard:0x786248,tavern:0xe0b78b,bank:0xcbd2ce,office:0xf1e5ce,warehouse:0xb4a087,workshop:0xb57d52,house:0xe7d7b0};
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m;}
function place(){const n=layout.size;cam.position.set(n*.85*Math.sin(yaw),n*.8,n*.85*Math.cos(yaw));cam.lookAt(0,0,0);renderer.render(scene,cam);}
async function build(){const id=document.getElementById('city').value,pop={cadiz:8000,barcelona:25000,lisboa:15000}[id];layout=await cityPlots(id,pop);if(scene)scene.traverse(o=>{o.geometry?.dispose();if(o.material)o.material.dispose();});scene=new THREE.Scene();scene.background=new THREE.Color(0x87a8b2);scene.add(new THREE.HemisphereLight(0xfff0cf,0x655d45,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-20,50,10);scene.add(light);targets=[];const n=layout.size;
box(n+6,.3,n+6,0x93916b,0,-.3,0);box(n+12,.1,14,0x376775,0,-.3,n/2+10);
for(const p of layout.paths){const x=(p.beg.x+p.end.x)/2-n/2,z=(p.beg.y+p.end.y)/2-n/2;box(Math.abs(p.end.x-p.beg.x)+1,.08,Math.abs(p.end.y-p.beg.y)+1,0xcdbd9d,x,0,z);}
for(const p of layout.plots){const x=p.x+p.w/2-n/2,z=p.y+p.d/2-n/2,h=p.type==='bank'?4:p.type==='house'?3:2;const body=box(p.w-.4,h,p.d-.4,colors[p.type],x,h/2,z);body.userData.plot=p;targets.push(body);const roof=new THREE.Mesh(new THREE.ConeGeometry(1,1.3,4),new THREE.MeshLambertMaterial({color:0x964d32}));roof.rotation.y=Math.PI/4;roof.scale.set((p.w-.1)/Math.SQRT2,1,(p.d-.1)/Math.SQRT2);roof.position.set(x,h+.65,z);roof.userData.plot=p;scene.add(roof);targets.push(roof);box(.6,1,.12,0x463522,x,.5,z+p.d/2-.15);}
cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,500);resize();document.getElementById('info').textContent=`${layout.paths.length} calles · ${layout.plots.length} parcelas. Servicios coloreados, talleres y viviendas. Tipos aún sin panel jugable conectado.`;}
function resize(){renderer.setSize(innerWidth,innerHeight);if(cam){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();place();}}addEventListener('resize',resize);
renderer.domElement.addEventListener('pointerdown',e=>{drag=e.clientX;moved=0;});renderer.domElement.addEventListener('pointermove',e=>{if(drag!==null){moved+=Math.abs(e.clientX-drag);yaw+=(e.clientX-drag)*.004;drag=e.clientX;place();}});renderer.domElement.addEventListener('pointerup',e=>{drag=null;if(moved>5)return;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),cam);const p=ray.intersectObjects(targets)[0]?.object.userData.plot;if(p)document.getElementById('info').textContent=`${names[p.type]} · parcela ${p.id} · ${p.w}×${p.d}. En el prototipo solo inspecciona; no abre servicio de la partida.`;});document.getElementById('city').onchange=build;await build();
</script></html>
