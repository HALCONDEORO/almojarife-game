<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Almojarife · Ciudad mediterránea</title><style>html,body{height:100%;margin:0;overflow:hidden;background:#7cacae;color:#463a25;font:15px Georgia}canvas{display:block;width:100%;height:100%;touch-action:none}nav{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}nav>*{pointer-events:auto}button,select{min-height:44px;padding:8px 12px;background:#f6e9c8;border:1px solid #9d865d;color:#463a25;border-radius:4px;font:15px Georgia}button[aria-pressed=true]{background:#506e56;color:white}.bldlab{position:fixed;display:none;transform:translate(-50%,-115%);background:#1b2a33cc;color:#ffe9b0;padding:1px 7px;border-radius:4px;font-size:12px;pointer-events:auto;cursor:pointer;text-shadow:0 1px 2px #000;white-space:nowrap;z-index:1}#tip{position:fixed;bottom:12px;left:12px;max-width:calc(100% - 48px);background:#f6e9c8ed;padding:8px 12px;border-radius:4px;pointer-events:none}#tip:empty{display:none}#error{position:fixed;inset:30%;background:#f6e9c8;padding:20px} @media(max-width:600px){nav{gap:4px}button,select{padding:7px 9px;font-size:14px}#tip{font-size:14px}}</style><canvas aria-label="Plano de la ciudad"></canvas><nav><button id="fit">Encajar</button><button id="plus" aria-label="Acercar">+</button><button id="minus" aria-label="Alejar">-</button><button id="grid" aria-pressed="false">Parcelas</button><button id="build" aria-pressed="false">Vista previa</button><select id="type" aria-label="Edificio de la vista previa" hidden></select><select id="level" aria-label="Nivel de la vista previa" hidden><option value="1">Nivel 1</option><option value="2">Nivel 2</option><option value="3">Nivel 3</option></select><button id="motion" aria-pressed="true">Animaciones</button></nav><div id="tip"></div><div id="error" hidden></div><script type="module" src="scene.mjs"></script></html>
