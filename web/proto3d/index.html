<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Almojarife - 3D port prototype</title>
<style>html,body{margin:0;height:100%;background:#1b2a33;font:14px sans-serif;color:#fff}canvas{display:block;width:100%;height:100%}#hud{position:fixed;left:10px;top:8px;text-shadow:0 1px 2px #000}.bldlab{position:fixed;display:none;transform:translate(-50%,-115%);background:#1b2a33cc;color:#ffe9b0;padding:1px 7px;border-radius:4px;font-size:12px;pointer-events:auto;cursor:pointer;text-shadow:0 1px 2px #000;white-space:nowrap}</style></head>
<body><div id="tip" style="position:fixed;display:none;padding:3px 8px;background:#000b;border-radius:4px;pointer-events:none"></div><div id="hud"></div>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from "three";
import { buildPortScene, animateWater, pickBuilding, cameraPose, CAMERA, setHover, buildingOf, plotSceneRect } from "../../src/view3d/port3d.mjs";
import { cityPlots } from "../../src/view3d/cityplots.mjs";
import { BUILDING_TYPES } from "../../src/game/buildings.mjs";
import { TICKS_PER_DAY } from "../../src/sim/clock.mjs";
const q = new URLSearchParams(location.search); document.getElementById("hud").textContent = q.get("hud") || "Drag to look around, wheel to zoom, click a building to open it."; const city = q.get("city") || "cadiz";
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
const popN = +(q.get("pop") || 12000), bldState = JSON.parse(q.get("bld") || "{}"), tickNow = +(q.get("tick") || 0);
let plots3d = [];
try {
  const layout = await cityPlots(city, popN);
  plots3d = Object.entries(bldState).map(([pid, b]) => {
    const lp = layout.plots.find((p) => p.id === pid); if (!lp) return null; // layout is canonical: unknown ids are dropped, never rendered
    let progress = 0.5;
    if (b.state === "construction" && Number.isFinite(b.readyTick)) { const total = (BUILDING_TYPES[b.type]?.buildDays ?? 3) * (b.nextLevel ?? 1) * TICKS_PER_DAY; progress = Math.min(1, Math.max(0, 1 - (b.readyTick - tickNow) / total)); }
    return { id: pid, rect: plotSceneRect(lp, layout.size), state: b.state, type: b.type, level: b.level || 1, progress };
  }).filter((p) => p && p.rect);
} catch { plots3d = []; } // a survey failure shows no plots; the Buildings tab still works
const { scene, water } = buildPortScene(THREE, { id: city, pop: popN, ships: +(q.get("ships") || 3), warehouse: q.get("wh") === "1", tod: +(q.get("tod") || 0.5), plots3d });
const cam = new THREE.PerspectiveCamera(CAMERA.fov, 1, 0.5, 400); let yaw = 0, zoom = 1.3;
const place = () => { const p = cameraPose(zoom, yaw); cam.position.set(p.x, p.y, p.z); cam.lookAt(...p.look); };
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.fov = cam.aspect < 1 ? CAMERA.fovPortrait : CAMERA.fov; cam.updateProjectionMatrix(); }; addEventListener("resize", resize); resize(); place();
let drag = null, moved = 0, hov = null; const names = { ...JSON.parse(q.get("tnames") || "{}"), ...JSON.parse(q.get("names") || "{}") }, pnames = JSON.parse(q.get("pnames") || "{}"), tip = document.getElementById("tip");
const ndc = (e) => [(e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1];
addEventListener("pointerdown", (e) => { drag = [e.clientX]; moved = 0; });
addEventListener("pointerup", (e) => { const click = moved < 5; drag = null; if (!click) return; const b = pickBuilding(THREE, scene, cam, ...ndc(e)); if (b?.startsWith("plot:")) parent.postMessage({ kind: "plot", id: b.slice(5) }, location.origin); else if (b) parent.postMessage({ kind: "building", id: b }, location.origin); });
addEventListener("pointermove", (e) => { const b = drag ? null : pickBuilding(THREE, scene, cam, ...ndc(e)); const oname = (x) => (x.startsWith("plot:") || x.startsWith("town:") ? x : "building:" + x); if (b !== hov) { if (hov) { const o = scene.getObjectByName(oname(hov)); o?.traverse((m) => { if (m.userData.orig) m.material = m.userData.orig; }); } if (b) { const o = scene.getObjectByName(oname(b)); o?.traverse((m) => { if (m.isMesh) { m.userData.orig = m.material; m.material = m.material.clone(); m.material.emissive?.setHex(0xf1e8cf); m.material.emissiveIntensity = 0.12; } }); } hov = b; }
  document.body.style.cursor = b ? "pointer" : ""; tip.style.display = b ? "block" : "none"; if (b) { tip.textContent = b.startsWith("plot:") ? (pnames[b.slice(5)] || b.slice(5)) : (names[b] || b); tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 10 + "px"; } });
addEventListener("pointermove", (e) => { if (drag) { moved += Math.abs(e.clientX - drag[0]); yaw = Math.max(-CAMERA.yawMax, Math.min(CAMERA.yawMax, yaw + (e.clientX - drag[0]) * 0.003)); drag[0] = e.clientX; place(); } });
addEventListener("wheel", (e) => { zoom = Math.max(CAMERA.zoom[0], Math.min(CAMERA.zoom[1], zoom * (e.deltaY > 0 ? 1.06 : 0.94))); place(); });
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Floating name labels over owned plots and public buildings (names arrive localized in the URL).
const labEls = [...Object.entries(JSON.parse(q.get("labels") || "{}")).map(([id, txt]) => ({ id, kind: "plot", txt })), ...Object.entries(names).map(([id, txt]) => ({ id, kind: "building", txt }))].map(({ id, kind, txt }) => { const el = document.createElement("div"); el.className = "bldlab"; el.textContent = txt; el.title = txt; el.addEventListener("click", () => parent.postMessage({ kind, id }, location.origin)); document.body.appendChild(el); return { id, kind, el }; }); // labels stay clickable even when scenery hides the building
const labV = new THREE.Vector3(), labBox = new THREE.Box3();
const labObj = ({ id, kind }) => kind === "plot" ? scene.getObjectByName("plot:" + id) : scene.getObjectByName("building:" + id) || scene.getObjectByName(id); // the warehouse group keeps its plain name
const placeLabels = () => { for (const { el, ...L } of labEls) { const o = labObj(L); if (!o) { el.style.display = "none"; continue; } labBox.setFromObject(o); labV.set((labBox.min.x + labBox.max.x) / 2, labBox.max.y, (labBox.min.z + labBox.max.z) / 2); labV.project(cam); if (labV.z > 1 || labV.z < -1) { el.style.display = "none"; continue; } el.style.display = "block"; el.style.left = ((labV.x * 0.5 + 0.5) * innerWidth) + "px"; el.style.top = ((-labV.y * 0.5 + 0.5) * innerHeight) + "px"; } };
window.__scene = scene; window.__cam = cam; // verification handles (tests, screenshots)
renderer.setAnimationLoop((ms) => { const t = still ? 0 : ms / 1000; animateWater(water, t); placeLabels(); scene.getObjectByName("ship"); scene.children.filter((c) => c.name === "ship").forEach((s, i) => { s.position.y = 0.2 + Math.sin(t * 1.3 + i) * 0.08; s.rotation.z = Math.sin(t * 0.9 + i) * 0.026; }); renderer.render(scene, cam); window.__ready = true; });
</script></body></html>
