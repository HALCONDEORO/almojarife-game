<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almojarife - city window design proposal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172b35;color:#eee2bc;font-family:Georgia,serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;gap:20px;padding:15px 24px;background:linear-gradient(#192027f5,#192027c0);border-bottom:1px solid #b99a61;color:#f6e6bb}.brand{font-size:24px;letter-spacing:3px}.meta{font:14px system-ui}.notice{position:fixed;top:72px;left:24px;background:#14232bdd;border-left:3px solid #cbaa67;padding:10px 14px;font:13px system-ui;max-width:380px}.window{position:absolute;top:160px;right:48px;width:475px;max-width:calc(100vw - 24px);background:#eee0ba;color:#30261b;border:2px solid #a78347;box-shadow:0 15px 50px #0009}.handle{touch-action:none;cursor:move;background:#3d3022;color:#f8e9c2;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;font-size:23px}.close{background:none;color:inherit;border:1px solid #c0a372;font:18px serif;cursor:pointer;padding:3px 9px}.inside{padding:20px}h2{font-size:23px;font-weight:normal;margin:0 0 10px}.caption{font:12px system-ui;color:#706045;margin:6px 0 14px}.lead{font-size:15px;line-height:1.5;margin:10px 0 18px}.stats{display:flex;justify-content:space-between;border-block:1px solid #baa678;padding:12px 0;gap:12px;font:14px system-ui}.action{border:1px solid #907448;background:#554028;color:#fff0c9;padding:12px 16px;font:14px system-ui;cursor:pointer;width:100%;margin-top:16px}.art{display:block;width:100%;height:155px;background:#c5af82}.bar{position:fixed;inset:auto 0 0;background:#25231ff5;border-top:2px solid #ac8b4c;display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap}.bar button{background:#3d3528;color:#f5e5ba;border:1px solid #9b824f;padding:12px 20px;font:15px Georgia;cursor:pointer;min-height:44px}.bar button.active{background:#c8ab6a;color:#261e16}.small{font:12px system-ui;opacity:.8}button:focus-visible{outline:3px solid #e8c875;outline-offset:3px}@media(max-width:600px){.top{padding:10px 12px}.brand{font-size:18px}.meta{font-size:11px}.notice{top:65px;left:12px;max-width:calc(100vw - 24px)}.window{top:145px;right:12px;max-height:calc(100dvh - 275px);overflow:auto}.handle{position:sticky;top:0}.stats{flex-direction:column;gap:6px}.bar{gap:4px;padding:8px}.bar button{padding:9px 11px;font-size:13px}.inside{padding:14px}.art{height:110px}}
</style>
<iframe title="Ciudad 3D actual" src="../proto3d/index.html?city=cadiz&pop=40000&ships=3&wh=1&hud=%20"></iframe>
<header class="top"><div><div class="brand">ALMOJARIFE</div><span class="small" id="city">Cádiz · Puerto de origen</span></div><div class="meta">Año 1500 · Día 24 · Tarde<br><br>2.000 monedas · 1 barco</div></header>
<div class="notice">PROPUESTA VISUAL · No es una partida real<br>La ciudad permanece detrás de cada ventana.</div>
<section class="window" role="dialog" aria-labelledby="heading"><header class="handle"><span id="heading"></span><button class="close" aria-label="Cerrar ventana">×</button></header><div class="inside"><svg class="art" viewBox="0 0 440 155" role="img" aria-label="Ilustración conceptual propia del edificio"><rect width="440" height="155" fill="#bba57e"/><path d="M0 140L0 100 70 75 110 98 155 70 215 98 280 80 335 100 440 85 440 155Z" fill="#8e9175"/><g id="illustration"></g><path d="M0 139H440" stroke="#7a6545" stroke-width="4"/></svg><div class="caption">Ilustración propia de propuesta · no arte definitivo</div><h2 id="sub"></h2><p class="lead" id="description"></p><div class="stats" id="stats"></div><button class="action" type="button" id="action"></button><p class="caption" id="feedback">Los botones solo muestran el flujo. No gastan monedas ni bienes.</p></div></section>
<nav class="bar" aria-label="Accesos de ciudad"><button data-view="market">Mercado</button><button data-view="shipyard">Astillero</button><button data-view="tavern">Taberna</button><button data-view="bank">Banco</button><button data-view="warehouse">Almacén</button><button data-view="house">Casa</button><button data-view="office">Oficina</button><button data-info="Mapa">Mapa</button><button data-info="Barcos">Barcos</button><button data-info="Informes">Informes</button></nav>
<script>
const content={
market:['Mercado','Comprar y vender','Consulta los precios y el stock del puerto. La ciudad queda visible mientras preparas la carga.','Grano · precio de ejemplo','Bodega · 0/60','Preparar compra (propuesta)'],
shipyard:['Astillero','Gradas y encargos','Encarga un barco o repara el casco. Las necesidades de madera, hierro y paño se definirán con la economía.','Materiales · por calibrar','Gradas · propuesta','Ver encargo (propuesta)'],
tavern:['Taberna','Noticias del puerto','Escucha rumores de precios y contrata tripulación sin salir de la ciudad.','Rumores · propuesta','Marineros · propuesta','Ver rumores (propuesta)'],
bank:['Banco','Crédito y pagos','Revisa préstamos y vencimientos. Ninguna cifra de este mock se aplica a una partida.','Crédito · por revisar','Deuda · ejemplo','Consultar crédito (propuesta)'],
warehouse:['Almacén','Mercancías bajo techo','Guarda carga en este puerto. Capacidad, materiales de mejora y mantenimiento se calibrarán juntos.','Capacidad · por calibrar','Stock · ejemplo','Ver mercancías (propuesta)'],
house:['Casa de comercio','Tu sede en Cádiz','Tu Casa solo existe en la ciudad que elegiste al empezar. Aquí diriges la compañía y sus oficinas comerciales.','Sede · Cádiz','Delegaciones · propuesta','Gestionar la compañía (propuesta)'],
office:['Oficina comercial','Una delegación en Lisboa','Fuera de tu ciudad inicial abres una Oficina, no otra Casa. Podrá guardar mercancías y contratar un agente local.','Apertura · por calibrar','Mantenimiento · por calibrar','Preparar apertura (propuesta)']};
const shapes={market:'<path d="M65 70H375V105H65Z" fill="#a14939"/><path d="M80 105V140M360 105V140" stroke="#56402a" stroke-width="8"/><path d="M90 65H350L380 95H60Z" fill="#eee0ba"/><path d="M145 65L135 95M205 65L200 95M265 65L270 95M325 65L335 95" stroke="#a14939" stroke-width="22"/><rect x="110" y="118" width="220" height="22" fill="#795b36"/>',shipyard:'<path d="M80 108Q220 175 355 100L325 140H125Z" fill="#6f4b2c"/><path d="M75 50H350M100 45V140M325 45V140" stroke="#6e5032" stroke-width="8"/><path d="M60 50L210 10 370 50Z" fill="#9a5f3f"/>',house:'<rect x="140" y="55" width="160" height="85" fill="#dfc991"/><path d="M125 55L220 12 315 55Z" fill="#98523d"/><rect x="207" y="91" width="28" height="49" fill="#604831"/><path d="M161 72H185V95H161ZM254 72H278V95H254Z" fill="#594a3b"/>',office:'<rect x="95" y="72" width="250" height="68" fill="#d8c494"/><path d="M80 72L220 27 360 72Z" fill="#927047"/><rect x="197" y="97" width="45" height="43" fill="#654c34"/><path d="M120 90H155V115H120ZM280 90H315V115H280Z" fill="#6a644d"/>',bank:'<path d="M115 60L220 18 330 60Z" fill="#d7c592"/><path d="M130 65V135M190 65V135M250 65V135M310 65V135" stroke="#e5d5ad" stroke-width="20"/><rect x="105" y="135" width="230" height="10" fill="#7c6a4c"/>',tavern:'<rect x="115" y="65" width="210" height="75" fill="#d5bb86"/><path d="M95 65L220 20 345 65Z" fill="#864d37"/><rect x="190" y="92" width="45" height="48" fill="#5e4630"/><circle cx="285" cy="105" r="19" fill="#94713e"/>',warehouse:'<rect x="80" y="65" width="280" height="75" fill="#c9b27e"/><path d="M65 65L220 17 375 65Z" fill="#876442"/><rect x="140" y="88" width="160" height="52" fill="#715536"/><path d="M220 88V140" stroke="#d0b481" stroke-width="3"/>'};
function openView(key){const frame=document.querySelector('iframe');const target=key==='office'?'lisboa':'cadiz';if(!frame.src.includes('city='+target+'&'))frame.src='../proto3d/index.html?city='+target+'&pop=40000&ships=3&wh=1&hud=%20';const c=content[key]||content.market;document.querySelector('.window').hidden=false;document.getElementById('heading').textContent=c[0];document.getElementById('sub').textContent=c[1];document.getElementById('description').textContent=c[2];document.getElementById('stats').innerHTML='<span>'+c[3]+'</span><span>'+c[4]+'</span>';document.getElementById('action').textContent=c[5];document.getElementById('illustration').innerHTML=shapes[key]||shapes.market;document.getElementById('city').textContent=key==='office'?'Lisboa · Puerto visitado':'Cádiz · Puerto de origen';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openView(b.dataset.view));document.querySelector('.close').onclick=()=>document.querySelector('.window').hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.window').hidden=true});addEventListener('message',e=>{if(e.origin===location.origin&&e.source===document.querySelector('iframe').contentWindow&&e.data.kind==='building')openView(e.data.id)});document.getElementById('action').onclick=()=>document.getElementById('feedback').textContent='Vista de propuesta: no se ha cambiado ninguna partida.';document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>document.getElementById('feedback').textContent=b.dataset.info+': acceso previsto; pantalla no implementada en este mock.');const h=document.querySelector('.handle'),win=document.querySelector('.window');let drag=null;h.onpointerdown=e=>{if(e.target.closest('button'))return;drag=[e.clientX-win.offsetLeft,e.clientY-win.offsetTop];h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-drag[0]))+'px';win.style.top=Math.max(65,Math.min(innerHeight-100,e.clientY-drag[1]))+'px';win.style.right='auto'};h.onpointerup=()=>drag=null;openView(new URLSearchParams(location.search).get('view')||'market');
</script></html>
