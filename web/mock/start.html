<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almojarife - propuesta de inicio</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#163d49;color:#352718;font:17px Georgia,serif}main{max-width:1120px;margin:auto;padding:30px 24px}small,.meta{font:14px system-ui;line-height:1.5}.badge{display:inline-block;background:#ead6a5;color:#352718;padding:8px 12px}h1{font-size:clamp(38px,7vw,72px);margin:25px 0 5px;color:#f4e7c9;font-weight:normal}header p{color:#e1d4b5;max-width:650px;line-height:1.5}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{font:inherit;min-height:44px;padding:10px 18px;color:#f8edda;border:1px solid #a7884f;background:#614728;cursor:pointer}button.active{background:#d9bc7b;color:#352718}button:focus-visible{outline:3px solid white;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#f5e9c9;padding:24px;border-top:5px solid #b89651;display:flex;flex-direction:column;gap:12px;min-height:330px}.card h2{font-weight:normal;font-size:27px;margin:0}.card p{line-height:1.5;margin:0}.card .meta{border-top:1px solid #d1bd8d;padding-top:12px;margin-top:auto}.card button{width:100%}footer{color:#e1d4b5;line-height:1.5;padding:22px 0}#detail{background:#f5e9c9;padding:24px;margin:20px 0}#detail h2{margin-top:0}svg{width:100%;height:80px;display:block}a{color:inherit}@media(max-width:700px){main{padding:20px 16px}.grid{grid-template-columns:1fr}.card{min-height:0;padding:20px}h1{margin-top:18px}}
</style><main><span class="badge">PROPUESTA · No es una partida real</span><header><h1>El Almojarife</h1><p>Levanta tu casa mercantil. Compra, navega y gana un lugar entre las ciudades del mar.</p></header><nav aria-label="Inicio"><button data-mode="continue">Continuar</button><button data-mode="campaign" class="active">Campañas</button><button data-mode="free">Partida libre</button><button data-mode="settings">Opciones</button></nav><section id="detail" hidden></section><section class="grid" id="campaigns"></section><footer><small>Esquema para revisar. Las campañas, objetivos y desbloqueos son propuestas, no están implementados. No se cambia tu partida guardada. Ilustraciones originales.</small></footer></main><script>
const campaigns=[{n:'01',title:'Aprender el oficio',place:'Cádiz · Aprendizaje guiado',text:'Una nave, un primer cargamento y un viaje corto. Aprende precios, bodega, gastos y regreso a puerto.',goal:'Propuesto: completar un viaje rentable y leer su informe.',art:'boat'}, {n:'02',title:'Una casa en cada orilla',place:'Red de puertos · Expansión',text:'Decide dónde guardar mercancía y qué rutas merecen una segunda nave. Tu sede sigue en el puerto inicial.',goal:'Propuesto: sostener una ruta y dos almacenes. Oficina comprable aún por definir.',art:'house'}, {n:'03',title:'Contra viento y precio',place:'Comercio difícil · Competencia',text:'Mercados que cambian y rivales por las mismas cargas. Crecer sin perder la caja exige elegir.',goal:'Propuesto: meta y plazo por calibrar con costes y competencia reales.',art:'wave'}];
function art(kind){let paths=kind==='boat'?'<path d="M70 48H250L220 72H100Z" fill="#715032"/><path d="M155 48V4L214 40H155Z" fill="#c59f55"/>':kind==='house'?'<path d="M70 70V24L125 5L180 24V70Z" fill="#c59f55"/><path d="M195 70V34H245V70" fill="#b9a883"/><path d="M111 70V40H140V70" fill="#715032"/>':'<path d="M20 42Q60 2 100 42T180 42T260 42M20 63Q60 23 100 63T180 63T260 63" fill="none" stroke="#637e7c" stroke-width="6"/>';return '<svg viewBox="0 0 320 80" aria-hidden="true">'+paths+'</svg>'}
document.getElementById('campaigns').innerHTML=campaigns.map((c,i)=>`<article class="card">${art(c.art)}<small>CAMPAÑA ${c.n}</small><h2>${c.title}</h2><small>${c.place}</small><p>${c.text}</p><p class="meta">${c.goal}</p><button data-campaign="${i}">Ver propuesta</button></article>`).join('');
const d=document.getElementById('detail');document.querySelectorAll('[data-campaign]').forEach(b=>b.onclick=()=>{const c=campaigns[b.dataset.campaign];d.hidden=false;d.innerHTML=`<h2>${c.title}</h2><p>${c.goal}</p><p>Flujo propuesto: campaña → personaje y casa → puerto inicial → ciudad 3D → primer objetivo. Ninguna partida se inicia desde este mock.</p>`;d.scrollIntoView({behavior:'smooth'});});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));const m=b.dataset.mode;document.getElementById('campaigns').hidden=m!=='campaign';d.hidden=m==='campaign';d.innerHTML=({continue:'<h2>Continuar</h2><p>Propuesto: compañía, día, puerto y última fecha guardada. Un botón reanuda la partida real. Aquí no se accede a tus guardados.</p>',free:'<h2>Partida libre</h2><p>Propuesto: elegir casa, personaje, puerto y dificultad. Sin capítulos guiados. Objetivo y final libre pendientes de definir.</p>',settings:'<h2>Opciones</h2><p>Propuesto: español / English, sonido y accesibilidad. Importar y exportar partidas, fuera del camino principal de empezar.</p>'})[m]||'';});
</script></html>
