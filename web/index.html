/* Full-window layout: the page never scrolls, each panel scrolls inside itself. */
html,body{height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
header{flex:none}
main{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden;box-sizing:border-box}
main>.card{min-height:0;min-width:0;overflow:auto;display:flex;flex-direction:column}

#mapcard>#log:empty{display:none}
@media(max-width:1100px){
#maparea>#mapleft{bottom:8px}
}
