<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Almojarife</title>
<style>
body{margin:0;font:15px Georgia,serif;background:#e8d9b5;color:#3a2a14}
header{padding:8px 14px;background:#c9b07a;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
header b{font-size:18px}
main{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(300px,1fr);gap:10px;padding:10px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:#f4ead0;border:1px solid #b8a06a;border-radius:6px;padding:8px}
svg{width:100%;height:auto;background:#d9c79c;border-radius:4px}
table{width:100%;border-collapse:collapse}tr.deal td{text-align:left;font-size:12px;border-bottom:1px solid #ccb;padding-bottom:5px}svg.spark{vertical-align:middle;width:48px;height:16px;display:inline-block;background:none}small.tr{opacity:.8}td.qty{white-space:nowrap}td.qty button{min-width:26px}td.qty b{display:inline-block;min-width:28px;text-align:center}td,th{padding:2px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
button{font:inherit;background:#8a6a2f;color:#fff8e6;border:0;border-radius:4px;padding:3px 8px;cursor:pointer;margin:1px}
button:disabled{opacity:.4;cursor:default}
.tabs{margin:6px 0}.tabs button:disabled{opacity:1;background:#5a4220}
.hint{background:#fff4c2;border-left:4px solid #c9962a;padding:6px;margin-bottom:6px}
#log{max-height:110px;overflow:auto;font-size:13px}
.city{cursor:pointer}.city:hover circle{fill:#a23}
#title{position:fixed;inset:0;background:rgba(58,42,20,.82);display:flex;align-items:center;justify-content:center;z-index:5}#title[hidden]{display:none}#title .box.wide{max-width:760px;max-height:92vh;overflow:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}@media(max-width:700px){.cols{grid-template-columns:1fr}}#title label{display:block;margin:4px 0}#title input,#title select{font:inherit;padding:3px}.ports{display:flex;flex-wrap:wrap;gap:4px}.pt,.sw{padding:0;border:2px solid transparent}.pt.on,.sw.on{border-color:#a11}.sw{width:26px;height:26px;border-radius:50%;border:2px solid #3a2a14;margin:2px}.sw.on{outline:3px solid #a11}.prev{display:flex;gap:10px;justify-content:center;margin:6px 0}#title .box{background:#f4ead0;border:2px solid #8a6a2f;border-radius:8px;padding:22px 28px;max-width:440px;text-align:center}#title h1{margin:0 0 4px}#title input[type=text],#co-in{font:inherit;padding:4px;width:90%;margin:6px 0 12px}#t-msg{color:#a11;margin-top:8px}
svg.crest,svg.portrait{width:auto;background:none;border-radius:0;display:inline-block;vertical-align:middle}
svg.gi{width:22px;height:22px;display:inline-block;background:none;border-radius:0}</style></head><body>
<header><b>El Almojarife</b><span id="co"></span><span id="day"></span><span id="cash"></span><span id="goal"></span><span id="ships"></span>
<span id="ctl"><button id="play"></button> <button id="spd"></button></span><span style="margin-left:auto"><button id="lang">EN</button> <button id="new">Menú</button></span></header>
<main>
<section class="card"><div class="hint" id="hint"></div><svg id="map" viewBox="0 0 800 600"></svg><div id="log"></div></section>
<section class="card"><div id="panel"></div></section>
</main>
<div id="title" hidden></div>
<script type="module" src="main.mjs"></script></body></html>
